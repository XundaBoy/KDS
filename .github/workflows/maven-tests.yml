name: Testes Java Maven

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw
        working-directory: Integrador2025.1/Integrador2025.1

      - name: Rodar testes
        run: ./mvnw test
        working-directory: Integrador2025.1/Integrador2025.1
