services:
  mysql:
    image: mysql:8.4
    container_name: kds-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: integrador
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - kds_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  kds_mysql_data:
